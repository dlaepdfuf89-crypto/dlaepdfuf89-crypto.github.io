plugins { id 'com.android.application' }

android {
    namespace 'com.deokseol.survive60'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deokseol.survive60'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'oneadmax_app_key', (project.findProperty('oneAdMaxAppKey') ?: 'UNCONFIGURED').toString()
        resValue 'string', 'oneadmax_reward_placement', (project.findProperty('oneAdMaxRewardPlacement') ?: 'UNCONFIGURED').toString()
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ONE AdMax Android SDK. Actual requests are OFF unless official keys exist.
dependencies { implementation 'com.oneadmax.sdk:sdk-ads:1.2.5' }
