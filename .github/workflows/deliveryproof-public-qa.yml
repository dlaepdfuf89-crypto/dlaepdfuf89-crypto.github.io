name: DeliveryProof public QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deliveryproof-public-qa.yml'
      - 'deliveryproof/qa/public-smoke.mjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deliveryproof-public-qa
  cancel-in-progress: false
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six published DeliveryProof pages and their CTA references
        run: node deliveryproof/qa/public-smoke.mjs
