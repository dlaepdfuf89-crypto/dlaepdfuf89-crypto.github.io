name: Museum release-candidate packages (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unbought-museum-release-rc.yml'
permissions:
  contents: read
concurrency:
  group: museum-release-rc
  cancel-in-progress: true
jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            unbought-museum-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned Play AAB and ONE store APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          gradle -p unbought-museum-build/android-native :app:bundlePlayRelease :app:assembleOnestoreRelease --no-daemon --console=plain
          find unbought-museum-build/android-native/app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -print -exec sha256sum {} \;
      - name: Confirm release artifacts are NOT signed or ready to upload
        shell: bash
        run: |
          set -euo pipefail
          bundle=unbought-museum-build/android-native/app/build/outputs/bundle/playRelease/app-play-release.aab
          apk=unbought-museum-build/android-native/app/build/outputs/apk/onestore/release/app-onestore-release-unsigned.apk
          test -s "$bundle"
          test -s "$apk"
          printf 'UNSIGNED RELEASE CANDIDATE ONLY. Must set approved applicationId, real signing credentials and integrate live payment verification before any store upload.\n' > RELEASE_NOTES_UNSAFE_FOR_UPLOAD.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: museum-unsigned-release-candidates
          path: |
            unbought-museum-build/android-native/app/build/outputs/bundle/playRelease/app-play-release.aab
            unbought-museum-build/android-native/app/build/outputs/apk/onestore/release/app-onestore-release-unsigned.apk
            RELEASE_NOTES_UNSAFE_FOR_UPLOAD.txt
          retention-days: 14
          if-no-files-found: error
