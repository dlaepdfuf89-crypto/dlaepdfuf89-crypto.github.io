name: Survive 60 Android — free debug and unsigned release
on:
  push:
    branches: ['stage/survive60-android-poc-20261013', 'stage/survive60-onestore-admax-20261013']
    paths:
      - 'android-proof/**'
      - '.github/workflows/survive60-android-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build unsigned release and debug, no publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use pre-installed Android SDK, install API 35 only
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug and unsigned release APK
        working-directory: android-proof
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Upload private test APK
        uses: actions/upload-artifact@v4
        with:
          name: Survive60-Android-DEBUG-NOT-FOR-STORE
          path: android-proof/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload unsigned release (sign offline, never publish unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Survive60-Android-UNSIGNED-NOT-FOR-STORE
          path: android-proof/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
      - name: Save Android 35 signing utility for offline release QA
        uses: actions/upload-artifact@v4
        with:
          name: Android35-APKSigner-QA-Utility
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 1
          if-no-files-found: error

  emulator-offline-smoke:
    if: github.ref_name == 'stage/survive60-android-poc-20261013'
    name: Offline actual Android emulator smoke
    needs: build-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Survive60-Android-DEBUG-NOT-FOR-STORE
          path: /tmp/s60apk
      - name: Run game inside offline Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          disable-animations: false
          emulator-boot-timeout: 500
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            # Wait until PackageManager responds; boot_completed alone is not sufficient on a slow hosted emulator.
            adb wait-for-device
            for i in $(seq 1 30); do
              if adb shell pm path android >/dev/null 2>&1; then break; fi
              sleep 5
            done
            installed=0
            for i in 1 2 3; do
              if adb install --no-streaming -r /tmp/s60apk/app-debug.apk; then installed=1; break; fi
              echo "Emulator package install attempt $i failed; retrying after ADB reconnect"
              adb reconnect || true
              sleep 12
            done
            if [ "$installed" != "1" ]; then echo 'EMULATOR_INSTALL_FAILED'; exit 1; fi
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am start -n com.deokseol.survive60/.MainActivity
            sleep 16
            adb shell dumpsys activity activities | grep -m 2 'com.deokseol.survive60' || true
            adb shell screencap -p /sdcard/s60-game.png
            adb pull /sdcard/s60-game.png android-proof/emu_game.png
            adb shell uiautomator dump /sdcard/s60-ui.xml || true
            adb pull /sdcard/s60-ui.xml android-proof/emu_window.xml || true
            adb logcat -d -b crash > android-proof/emu_crash.log
            if grep -q 'com.deokseol.survive60' android-proof/emu_crash.log; then echo 'APP CRASHED'; exit 1; fi
            echo 'EMULATOR_NO_FATAL_CRASH_PASS'
      - name: Save screenshot and crash report for independent QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Survive60-Android-Offline-Emulator-QA
          path: |
            android-proof/emu_game.png
            android-proof/emu_window.xml
            android-proof/emu_crash.log
          if-no-files-found: warn
          retention-days: 7
