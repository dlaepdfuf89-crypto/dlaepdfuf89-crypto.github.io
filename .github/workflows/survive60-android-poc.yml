name: Survive 60 Android — free debug proof
on:
  push:
    branches: ['stage/survive60-android-poc-20261013']
    paths:
      - 'android-proof/**'
      - '.github/workflows/survive60-android-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK, no release/publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        working-directory: android-proof
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload private test APK
        uses: actions/upload-artifact@v4
        with:
          name: Survive60-Android-DEBUG-NOT-FOR-STORE
          path: android-proof/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
