plugins { id 'com.android.application' }
android {
 namespace 'com.deokseolstudio.unboughtmuseum'
 compileSdk 36
 defaultConfig {
  applicationId 'com.deokseolstudio.unboughtmuseum'
  minSdk 26
  targetSdk 36
  versionCode 1
  versionName '1.0.0'
 }
 // Both Android storefronts share the package identity intentionally; the
 // final upload/app-signing certificates MUST be aligned before publication.
 // No variant is ready for release until the real package ID is approved.
 flavorDimensions 'store'
 productFlavors {
  play { dimension 'store' }
  onestore { dimension 'store' }
 }
 buildTypes {
  debug { debuggable true }
  release { minifyEnabled false }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
dependencies {
 // OFFICIAL SDK DEPENDENCIES ONLY. Neither storefront purchase flow is wired
 // into MainActivity until store-owned IDs + receipt validator are configured.
 playImplementation 'com.android.billingclient:billing:9.1.0'
 onestoreImplementation 'com.onestorecorp.sdk:sdk-iap:21.04.00'
}
// Keep the existing first-party source and offline privacy boundary.
// No network permission, no analytics SDK, no secret, no signing credentials.
tasks.register('syncMuseumWeb', Copy) {
 from('../../dist')
 into('src/main/assets/site')
 exclude('sw.js')
 exclude('manifest.webmanifest')
}
tasks.named('preBuild').configure { dependsOn('syncMuseumWeb') }

// Align Kotlin standard libraries used by Play Billing and legacy IAP SDKs.
// Old kotlin-stdlib-jdk7/jdk8 1.6.x duplicate classes now in stdlib 1.8+.
configurations.configureEach {
 resolutionStrategy.eachDependency { details ->
  if (details.requested.group == 'org.jetbrains.kotlin' &&
      ['kotlin-stdlib','kotlin-stdlib-jdk7','kotlin-stdlib-jdk8'].contains(details.requested.name)) {
    details.useVersion '1.8.22'
    details.because('Avoid duplicate Kotlin stdlib classes across store SDKs')
  }
 }
}
