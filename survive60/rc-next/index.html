  <body>
    <div id="root"></div>
  <script type="module">
import {createSDK} from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";
const mark=(s)=>{try{sessionStorage.setItem("s60-oneplay-host-boot-diagnostic-v1",JSON.stringify({status:s,time:new Date().toISOString()}))}catch{}};
window.__s60OneplaySdkReady=false;
mark("initializing");
try{const sdk=createSDK();window.sdk=sdk;const result=await sdk.initializeAsync();if(result?.err){mark("initialize_rejected");}else{sdk.setLoadingProgress(100);await sdk.startGameAsync();window.__s60OneplaySdkReady=true;mark("native_sdk_ready")}}catch(e){mark("sdk_unavailable");console.warn("ONEplay host SDK unavailable",e)}
await import("/survive60/rc-next/assets/index-Co6HcCf0.js");
</script>
