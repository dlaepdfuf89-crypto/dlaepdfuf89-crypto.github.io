<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071321" />
    <link rel="icon" type="image/png" href="/survive60/iap-sandbox/favicon.png" />
    <title>60초만 버텨봐 | Survive 60</title>
    <script type="module">
const banner=document.createElement("div");
banner.id="sandbox-diagnostic";
banner.setAttribute("role","status");
banner.style.cssText="position:fixed;z-index:999999;top:3px;left:4px;right:123px;max-height:22px;overflow:hidden;background:rgba(10,18,37,.92);border:1px solid #76b9d0;border-radius:5px;padding:3px 5px;color:#e8f5ff;font:11px/1.4 sans-serif;white-space:nowrap;cursor:pointer;";
document.documentElement.appendChild(banner);
let sdkState="PENDING",purchaseState="PENDING",productState="-",serverState="PENDING",lastStage="-",lastFail="-";
let serverGrants="-",serverCoins="-",revoked="-",expanded=false;
banner.setAttribute("aria-label","Sandbox 진단 상세 펼치기");
banner.addEventListener("click",()=>{expanded=!expanded;banner.setAttribute("aria-label",expanded?"Sandbox 진단 상세 접기":"Sandbox 진단 상세 펼치기");paint();});
function paint(){
 let session="NO",legacy="NO",localCoins="-",paidMarks=0;
 try{
  session=localStorage.getItem("s60-oneplay-purchase-session-v1:survive60-oneplay-iap-sandbox.dlaepdfuf58.workers.dev")?"YES":"NO";
  legacy=localStorage.getItem("s60-oneplay-purchase-session-v1")?"YES":"NO";
  const wallet=JSON.parse(localStorage.getItem("s60-wallet-v2:oneplay-sandbox")||"null");
  if(wallet&&Number.isSafeInteger(wallet.balance)){localCoins=String(wallet.balance);paidMarks=Array.isArray(wallet.orders)?wallet.orders.filter(x=>typeof x==="string"&&x.startsWith("oneplay:")).length:0;}
 }catch{localCoins="READ_ERROR";}
 banner.style.top=expanded?"82px":"3px";
 banner.style.right=expanded?"4px":"123px";
 banner.style.maxHeight=expanded?"none":"22px";
 banner.style.whiteSpace=expanded?"pre-line":"nowrap";
 banner.textContent=expanded?("SANDBOX | SDK:"+sdkState+" | IAP:"+purchaseState+" | SKU:"+productState+" | API:"+serverState
  +"\nSESSION:"+session+" | LEGACY:"+legacy+" | SERVER:"+serverGrants+"건/"+serverCoins+"코인 | REFUNDS:"+revoked
  +"\nGAME COINS:"+localCoins+" | PURCHASE MARKERS:"+paidMarks+" | STEP:"+lastStage+" | ERROR:"+lastFail)
  :("SANDBOX | 서버:"+serverCoins+" · 게임:"+localCoins+" (상세)");
}
window.addEventListener("s60-iap-ledger",e=>{serverGrants=String(e.detail?.count??"?");serverCoins=String(e.detail?.coins??"?");revoked=String(e.detail?.revoked??"?");lastFail="-";paint();});
const retry=document.createElement("button");retry.textContent="↻ 코인 동기화";retry.type="button";
retry.style.cssText="position:fixed;z-index:1000001;right:5px;top:3px;border:1px solid #87e0ff;border-radius:5px;padding:5px 9px;background:#15364b;color:#fff;font:12px sans-serif;";
retry.addEventListener("click",()=>{lastStage="MANUAL_SYNC_REQUESTED";paint();window.dispatchEvent(new Event("s60-iap-sync-request"));});
document.documentElement.appendChild(retry);
setInterval(paint,2000);
paint();
window.addEventListener("s60-iap-error",e=>{lastFail=String(e.detail?.reason||"unknown").slice(0,100);paint();});
window.addEventListener("s60-iap-phase",e=>{lastStage=String(e.detail?.stage||"-").slice(0,28);paint();});
window.__s60OneplaySdkReady=false;
try{
 const m=await import("https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js");
 const sdk=m.createSDK();
 window.sdk=sdk;
 const result=await sdk.initializeAsync();
 if(result?.err){sdkState="ERROR "+String(result.err).slice(0,35);}
 else{
  sdk.setLoadingProgress(100);
  const started=await sdk.startGameAsync();
  if(started?.err){sdkState="START_ERROR "+String(started.err).slice(0,35);}
  else{window.__s60OneplaySdkReady=true;sdkState="OK";}
 }
 try{purchaseState=String(sdk.iap?.isSupported("purchase")===true);}catch{purchaseState="ERROR";}
 if(window.__s60OneplaySdkReady===true && sdk.iap?.isSupported("getProductDetails")===true){
  sdk.iap.getProductDetailsAsync(["coin_500"]).then(v=>{productState=Array.isArray(v)?(v.some(x=>x.productId==="coin_500")?"YES":"NOT_FOUND"):"INVALID";paint();}).catch(e=>{productState="ERROR "+String(e?.reason||"unknown").slice(0,28);paint();});
 }else{productState="UNSUPPORTED";}
}catch(error){sdkState="ERROR "+String(error?.reason||error?.message||error).slice(0,60);}
paint();
try{const res=await fetch("https://survive60-oneplay-iap-sandbox.dlaepdfuf58.workers.dev/v1/iap/availability",{cache:"no-store"});const obj=await res.json();serverState=res.status===200&&obj.ready===true?"OK":"HTTP "+res.status;}catch(error){serverState="NETWORK";}paint();
await import("/survive60/iap-sandbox/assets/index-YKSgDGZO.js");
</script>
    <link rel="stylesheet" crossorigin href="/survive60/iap-sandbox/assets/index--DhrQQxl.css">
  </head>
  <body>
    <div id="root"></div> <div style="position:fixed;top:1px;right:6px;font:11px sans-serif;background:#11283b;color:#fff;z-index:99999;padding:4px">ONEplay Sandbox / test only</div>
  </body>
</html>
