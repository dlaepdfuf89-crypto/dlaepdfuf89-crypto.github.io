<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60초만 버텨봐 | Survive 60</title>
<style>html,body{margin:0;background:#071321;color:#fff;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;font-size:14px}</style>
<script src="https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js"></script>\n</head>
<body>
<div id="boot">Survive 60 로딩 중...</div>
<script>
(async()=>{
  const dec=new TextDecoder();
  let html="";
  try{
    for(let i=0;i<10;i++){
      const n=String(i).padStart(3,"0")+".txt";
      const r=await fetch("./chunks/"+n,{cache:"no-store"});
      if(!r.ok) throw new Error(n+" "+r.status);
      const b64=(await r.text()).trim();
      const raw=atob(b64);
      const bytes=new Uint8Array(raw.length);
      for(let j=0;j<raw.length;j++) bytes[j]=raw.charCodeAt(j);
      html+=dec.decode(bytes,{stream:true});
    }
    html+=dec.decode();
    const doc=new DOMParser().parseFromString(html,"text/html");
    document.title=doc.title||"60초만 버텨봐 | Survive 60";
    document.body.innerHTML=doc.body.innerHTML;
    document.head.querySelectorAll("style[data-game]").forEach(x=>x.remove());
    for(const st of doc.querySelectorAll("style")){
      const n=document.createElement("style");
      n.dataset.game="1";
      n.textContent=st.textContent;
      document.head.appendChild(n);
    }
    const src=doc.querySelector("script[type=module]")?.textContent||"";
    if(!src) throw new Error("game module missing");
    const s=document.createElement("script");
    s.type="module";
    s.textContent=src;
    document.body.appendChild(s);
  }catch(e){
    document.body.innerHTML='<div id="boot">로딩 실패: '+String(e.message||e)+'</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
