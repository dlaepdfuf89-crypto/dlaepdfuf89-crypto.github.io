<div id="s60-official-store-cta" hidden><a href="https://tossminiapp.com/d/deokseol60/launch" target="_blank" rel="noopener noreferrer" aria-label="토스 앱에서 60초만 버텨봐 무료 플레이"><span class="s60-official-tag">토스 정식판</span><span class="s60-official-copy"><b>토스에서 바로 무료 플레이</b><small>60초 생존 · 보상형 광고 · 코인 강화</small></span><span class="s60-official-arrow" aria-hidden="true">›</span></a><a class="s60-onestore-direct" href="https://onesto.re/oneplay/0001010330" target="_blank" rel="noopener noreferrer" aria-label="원스토어 ONEplay에서 60초만 버텨봐 게임하기">원스토어 ONEplay에서 게임하기 ↗</a></div>
<div id="root"></div>
<script type="module">
// Load SDK inside try so a blocked native SDK cannot prevent free browser play.
const mark=(s)=>{try{sessionStorage.setItem("s60-oneplay-host-boot-diagnostic-v1",JSON.stringify({status:s,time:new Date().toISOString()}))}catch{}};
window.__s60OneplaySdkReady=false;
mark("initializing");
// The browser-game directories embed this free demo in an iframe. Skip the
// unrelated ONEplay SDK there so their visitors can start playing immediately.
// Keep the original SDK startup path for direct visits and native ONEplay.
const approvedPortalEmbed=(()=>{
  try{
    if(window.self===window.top || !document.referrer)return false;
    const hostname=new URL(document.referrer).hostname.toLowerCase();
    const portals=["joystumble.com","rando.gg","stillonline.games","playlin.io","fastplaygames.com","hahagames.com","paizix.com","zadely.com","ilovewebgames.com"];
    return portals.some(domain=>hostname===domain || hostname.endsWith("."+domain));
  }catch{return false}
})();
if(approvedPortalEmbed){
  mark("browser_portal_embed_skip_oneplay_sdk");
}else{
  try{const {createSDK}=await import("https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js");const sdk=createSDK();window.sdk=sdk;const result=await sdk.initializeAsync();if(result?.err){mark("initialize_rejected");}else{sdk.setLoadingProgress(100);const started=await sdk.startGameAsync();if(started?.err){mark("game_start_rejected");}else{window.__s60OneplaySdkReady=true;mark("native_sdk_ready");}}}catch(e){mark("sdk_unavailable");console.warn("ONEplay host SDK unavailable",e)}
}
if(window.__s60OneplaySdkReady!==true){
  const officialCta=document.getElementById("s60-official-store-cta");
  // Browser game directories have international audiences. Do not change Toss/ONEplay runtime.
  const visitorLanguage=(navigator.languages?.[0]||navigator.language||"ko").toLowerCase();
  if(officialCta && !/^ko(?:-|$)/.test(visitorLanguage)){
    const tag=officialCta.querySelector(".s60-official-tag");
    const heading=officialCta.querySelector(".s60-official-copy b");
    const helper=officialCta.querySelector(".s60-official-copy small");
    const link=officialCta.querySelector("a");
    if(tag)tag.textContent="TOSS EDITION";
    if(heading)heading.textContent="Open the official game in Toss";
    if(helper)helper.textContent="Drag to move · Auto-fire · Survive 60 seconds";
    if(link)link.setAttribute("aria-label","Open Survive 60 in the Toss app");
    const oneplay=officialCta.querySelector(".s60-onestore-direct");
    if(oneplay){oneplay.textContent="Play on ONEplay ↗";oneplay.setAttribute("aria-label","Play Survive 60 via ONEplay");}
  }
  officialCta?.removeAttribute("hidden");
}
await import("/survive60/rc-next/assets/index-DzTmSkkv.js");
// Browser-only sharing: the live game shares via Toss SDK; browser demo viewers
// instead share the OFFICIAL edition. No native bundle, IAP, or ad SDK is changed.
if(window.__s60OneplaySdkReady!==true){
  const officialURL="https://tossminiapp.com/d/deokseol60/launch";
  let shareStatusTimer;
  const feedback=(msg)=>{
    let toast=document.getElementById("s60-browser-share-feedback");
    if(!toast){
      toast=document.createElement("div");
      toast.id="s60-browser-share-feedback";
      toast.setAttribute("role","status");toast.setAttribute("aria-live","polite");
      toast.style.cssText="position:fixed;z-index:9999;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,380px);padding:13px 18px;border:1px solid #72badd;border-radius:13px;background:#0c2947;color:#eefaff;box-shadow:0 14px 35px #0009;font:750 14px/1.4 system-ui,sans-serif;text-align:center;pointer-events:none";
      document.body.appendChild(toast);
    }
    toast.textContent=msg;
    window.clearTimeout(shareStatusTimer);
    shareStatusTimer=window.setTimeout(()=>{toast.remove()},3200);
  };
  document.addEventListener("click",(event)=>{
    const button=event.target instanceof Element?event.target.closest(".resultSocial button:last-child, .socialDock button:last-child"):null;
    if(!button || !/공유|share/i.test(button.textContent||""))return;
    event.preventDefault();event.stopImmediatePropagation();
    const ko=/^ko(?:-|$)/i.test(navigator.languages?.[0]||navigator.language||"ko");
    const title=ko?"60초만 버텨봐":"Survive 60";
    const message=ko?"친구야, 60초만 버텨봐! 토스에서 바로 무료 도전":"Can you survive 60 seconds? Play the official game on Toss";
    const shareText=message+"\n"+officialURL;
    if(typeof navigator.share==="function"){
      navigator.share({title,text:message,url:officialURL}).then(()=>feedback(ko?"정식 게임 링크 공유 완료":"Game link shared")).catch((e)=>{
        if(e?.name!=="AbortError")feedback(ko?"공유를 완료하지 못했습니다. 링크 복사를 이용해주세요.":"Sharing failed; use your browser's copy option.");
      });
    }else if(navigator.clipboard?.writeText){
      navigator.clipboard.writeText(shareText).then(()=>feedback(ko?"토스 정식 게임 링크가 복사됐습니다":"Official Toss game link copied")).catch(()=>feedback(ko?"링크 복사에 실패했습니다":"Could not copy the link"));
    }else{
      const field=document.createElement("textarea");
      field.value=shareText;field.readOnly=true;
      field.style.cssText="position:fixed;left:-9999px;top:0";
      document.body.appendChild(field);field.select();
      let ok=false;
      try{ok=document.execCommand("copy")}catch{}
      field.remove();
      feedback(ok?(ko?"토스 정식 게임 링크가 복사됐습니다":"Official Toss game link copied"):(ko?"링크 복사에 실패했습니다":"Could not copy the link"));
    }
  },true);
}
// The hosted browser demo itself cannot record monetized Toss or ONEplay sessions.
// Offer a direct, optional route only on the final result screen; native editions are untouched.
if(window.__s60OneplaySdkReady!==true){
  document.documentElement.classList.add("s60-browser-demo");
  const root=document.getElementById("root");
  let queued=false;
  const insertEditionChoices=()=>{
    // In the free browser demo, the Toss rewarded-ad SDK is unavailable. Do not
    // strand a first-time visitor behind an unclickable revival-ad button.
    const reviveScreen=root?.querySelector(".overlay.revive");
    const reviveAd=reviveScreen?.querySelector(".reviveBtn");
    const finishButton=reviveScreen?.querySelector(".giveUpBtn");
    if(reviveAd?.disabled && finishButton && !reviveScreen.querySelector("#s60-demo-revive-official")){
      const link=document.createElement("a");
      link.id="s60-demo-revive-official";
      link.href="https://tossminiapp.com/d/deokseol60/launch";
      link.target="_blank";link.rel="noopener noreferrer";
      link.setAttribute("aria-label","Play a new game in the official Toss edition");
      const ko=/^ko(?:-|$)/i.test(navigator.languages?.[0]||navigator.language||"ko");
      link.textContent=ko?"↗ 토스 정식판에서 새로 도전":"↗ Try a new run on Toss";
      finishButton.before(link);
    }
    const screen=root?.querySelector(".overlay.result");
    const actions=screen?.querySelector(".resultActions");
    if(!actions||screen.querySelector("#s60-demo-result-official"))return;
    const el=document.createElement("section");
    el.id="s60-demo-result-official";
    el.setAttribute("aria-label","정식 게임 플레이");
    const caption=document.createElement("span");
    caption.className="s60-result-caption";
    const english=!/^ko(?:-|$)/i.test(navigator.languages?.[0]||navigator.language||"ko");
    caption.textContent=english?"Play the official editions":"정식판에서 새 도전 시작하기";
    el.appendChild(caption);
    for(const item of [
      {label:english?"Play on Toss ↗":"토스 무료 플레이 ↗",cls:"s60-official-toss",url:"https://tossminiapp.com/d/deokseol60/launch"},
      {label:english?"ONEplay edition ↗":"ONEplay 정식판 ↗",cls:"s60-official-oneplay",url:"https://onesto.re/oneplay/0001010330"}
    ]){
      const a=document.createElement("a");
      a.href=item.url;a.target="_blank";a.rel="noopener noreferrer";a.className=item.cls;
      a.textContent=item.label;
      el.appendChild(a);
    }
    actions.before(el);
  };
  const observer=new MutationObserver(()=>{
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;insertEditionChoices()});
  });
  if(root){observer.observe(root,{childList:true,subtree:true});insertEditionChoices()}
}
</script>
