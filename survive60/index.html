    ["획득","獲得"],["최고","ベスト"],["기록 더 올리기","記録更新に挑戦"],
    ["바로 재도전","もう一度挑戦"],["메인으로 돌아가 강화하기","戻って強化"],
    ["코인 상점 · 영구 강화 바로가기","機体を強化する"],
    ["↗ 기록 공유하기","↗ 記録をシェア"],["↗ 최고기록 공유","↗ 記録をシェア"],
    ["광고 준비 중 · 결과 추가 보상","広告報酬は利用できません"]
  ]);
  const activeBrowserTranslations=japaneseBrowserVisitor?japaneseBrowserTranslations:browserTranslations;
  const localizeBrowserDemo=()=>{
    if(!englishBrowserVisitor||!root)return;
    const lobby=root.querySelector(".shell.lobbyMode");
    const targets=(lobby?[lobby]:[]).concat([
      root.querySelector(".hud"),
      root.querySelector(".overlay.revive"),
      root.querySelector(".overlay.result")
    ]).filter(Boolean);
    for(const target of new Set(targets)){
      const walker=document.createTreeWalker(target,NodeFilter.SHOW_TEXT);
      let node;
      while((node=walker.nextNode())){
        const content=node.nodeValue||"";
        const korean=content.trim();
        const english=activeBrowserTranslations.get(korean);
        if(english){node.nodeValue=content.replace(korean,english);continue;}
        if(japaneseBrowserVisitor){
          // Preserve original game state and all numeric values; translate dynamic labels only.
          const translated=korean
            .replace(/(\d+)클리어/g,"$1回クリア")
            .replace(/광고\s*(\d+\s*\/\s*\d+)회\s*·\s*준비 중/g,"広告報酬は現在利用できません")
            .replace(/([\d,]+)코인 교환/g,"$1コインと交換")
            .replace(/다음 랭크까지\s*(\d+)킬/g,"次のランクまであと$1キル")
            .replace(/오늘 미션까지\s*(\d+)킬/g,"今日のミッションまであと$1キル")
            .replace(/시즌\s*(\d+)P/g,"シーズン$1P")
            .replace(/다음\s+([A-Z]+)\s+(\d+)회/g,"次の$1まで$2回")
            .replace(/(\d+)킬/g,"$1キル");
          if(translated!==korean)node.nodeValue=content.replace(korean,translated);
        }
      }
    }
  };
  let queued=false;
  const insertEditionChoices=()=>{
    localizeBrowserDemo();
    // In the free browser demo, the Toss rewarded-ad SDK is unavailable. Do not
    // strand a first-time visitor behind an unclickable revival-ad button.
    const reviveScreen=root?.querySelector(".overlay.revive");
    const reviveAd=reviveScreen?.querySelector(".reviveBtn");
    const finishButton=reviveScreen?.querySelector(".giveUpBtn");
    if(reviveAd?.disabled && finishButton && !reviveScreen.querySelector("#s60-demo-revive-official")){
      const link=document.createElement("a");
      link.id="s60-demo-revive-official";
      link.href="https://tossminiapp.com/d/deokseol60/launch";
      link.target="_blank";link.rel="noopener noreferrer";
      link.setAttribute("aria-label","Play a new game in the official Toss edition");
      const ko=/^ko(?:-|$)/i.test(navigator.languages?.[0]||navigator.language||"ko");
      link.textContent=ko?"↗ 토스 정식판에서 새로 도전":japaneseBrowserVisitor?"↗ Toss版で再挑戦":"↗ Try a new run on Toss";
      finishButton.before(link);
    }
    const screen=root?.querySelector(".overlay.result");
    const actions=screen?.querySelector(".resultActions");
    if(!actions||screen.querySelector("#s60-demo-result-official"))return;
    const el=document.createElement("section");
    el.id="s60-demo-result-official";
    el.setAttribute("aria-label","정식 게임 플레이");
    const caption=document.createElement("span");
    caption.className="s60-result-caption";
    const english=!/^ko(?:-|$)/i.test(navigator.languages?.[0]||navigator.language||"ko");
    caption.textContent=japaneseBrowserVisitor?"韓国向け公式版でもプレイ":english?"Play the official editions":"정식판에서 새 도전 시작하기";
    el.appendChild(caption);
    for(const item of [
      {label:japaneseBrowserVisitor?"Toss版でプレイ ↗":english?"Play on Toss ↗":"토스 무료 플레이 ↗",cls:"s60-official-toss",url:"https://tossminiapp.com/d/deokseol60/launch"},
      {label:japaneseBrowserVisitor?"ONEplay版 ↗":english?"ONEplay edition ↗":"ONEplay 정식판 ↗",cls:"s60-official-oneplay",url:"https://onesto.re/oneplay/0001010330"}
    ]){
      const a=document.createElement("a");
      a.href=item.url;a.target="_blank";a.rel="noopener noreferrer";a.className=item.cls;
      a.textContent=item.label;
      el.appendChild(a);
    }
    actions.before(el);
  };
  const observer=new MutationObserver(()=>{
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;insertEditionChoices()});
  });
  // Keep mutation processing low-cost during real-time gameplay.
  if(root){observer.observe(root,{childList:true,subtree:true});insertEditionChoices()}
}
</script>
</body>
</html>
