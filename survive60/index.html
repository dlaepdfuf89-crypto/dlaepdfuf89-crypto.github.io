<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60초만 버텨봐 | Survive 60</title>
<style>html,body{margin:0;background:#071321;color:#fff;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;font-size:14px}</style>
</head>
<body>
<div id="boot">Survive 60 로딩 중...</div>
<script>
(async()=>{
  const dec=new TextDecoder();
  let html="";
  try{
    for(let i=0;i<11;i++){
      const n=String(i).padStart(3,"0")+".txt";
      const r=await fetch("./chunks/"+n,{cache:"no-store"});
      if(!r.ok) throw new Error(n+" "+r.status);
      const b64=(await r.text()).trim();
      const raw=atob(b64);
      const bytes=new Uint8Array(raw.length);
      for(let j=0;j<raw.length;j++) bytes[j]=raw.charCodeAt(j);
      html+=dec.decode(bytes,{stream:true});
    }
    html+=dec.decode();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById("boot").textContent="로딩 실패: "+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
