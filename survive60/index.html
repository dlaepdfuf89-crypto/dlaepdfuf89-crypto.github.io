      browserShareFeedback(button,ja?"挑戦リンクをコピーしました":ko?"도전 링크를 복사했습니다.":"Challenge link copied.");

      browserShareFeedback(button,ja?"コピーできませんでした。リンクを長押ししてください。":ko?"복사가 안 됩니다. 아래 게임 주소를 직접 공유해 주세요.":"Copy unavailable — share the game link below.");
    }
  };
  window.addEventListener("click",(event)=>{void handleBrowserResultShare(event);},true);
  const observer=new MutationObserver((records)=>{
    // Translate React-updated lobby text nodes, but do not scan during active gameplay HUD updates.
    const relevant=records.some(rec=>rec.type==="childList" || (rec.type==="characterData" && rec.target.parentElement?.closest(".overlay.intro,.overlay.revive,.overlay.result,.overlay.upgrade")));
    if(!relevant||queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;insertEditionChoices()});
  });
  // Keep mutation processing low-cost during real-time gameplay.
  if(root){
    observer.observe(root,{childList:true,subtree:true,characterData:true});
    insertEditionChoices();
    // Two low-cost post-mount passes handle dynamic labels updated by React text nodes.
    if(englishBrowserVisitor){
      window.setTimeout(insertEditionChoices,180);
      window.setTimeout(insertEditionChoices,850);
    }
  }
}
</script>
</body>
</html>
